name: Build Android APK

# Produces an installable APK as a downloadable artifact.
#
# The GitHub-hosted `ubuntu-latest` runner already has the Android SDK, JDK 17
# and the NDK, so this needs no extra setup beyond `expo prebuild` + Gradle.
# It requires no Expo account and no EAS credits.
#
# Run it from the Actions tab ("Run workflow"), or let it run on every push to
# the main branches. Download the APK from the run's Artifacts section.

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      variant:
        description: 'Build variant'
        required: true
        default: 'release'
        type: choice
        options: [debug, release]

# Supersede pull-request checks, but never kill a run that is producing an APK.
#
# `cancel-in-progress: true` across the board cancelled four builds in one
# afternoon: each push killed the run before it, and because the APK only
# exists as that run's artifact, cancelling it threw the APK away. A pull
# request re-check is genuinely disposable; a push or a manual dispatch is
# someone waiting for a file.
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci

      - name: Bundle for Android (Metro)
        run: npm run bundle:android

  apk:
    name: Build APK
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - run: npm ci

      - name: Write .env
        env:
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
        run: |
          # Secrets are optional: with none set, the APK still builds and runs
          # fully on-device against the bundled care library.
          {
            echo "EXPO_PUBLIC_SUPABASE_URL=${SUPABASE_URL}"
            echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}"
            echo "EXPO_PUBLIC_AI_MODEL=gpt-4o-mini"
            echo "EAS_PROJECT_ID=${EAS_PROJECT_ID}"
            echo "APP_VARIANT=production"
          } > .env

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Provide a signing key
        # A persistent keystore from secrets keeps the signature stable, so new
        # builds install over the old app. Without it we mint a throwaway key —
        # the APK still installs, but you must uninstall before upgrading.
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          cd android/app
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.keystore
            echo "persistent=true" >> "$GITHUB_OUTPUT"
            echo "Using the keystore from repository secrets."
          else
            echo "persistent=false" >> "$GITHUB_OUTPUT"
            keytool -genkeypair -v \
              -storetype PKCS12 \
              -keystore release.keystore \
              -alias glpcare \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'glpcare-ci' }}" \
              -keypass "${{ secrets.ANDROID_KEY_PASSWORD || 'glpcare-ci' }}" \
              -dname "CN=GLP Care, OU=Engineering, O=GLP Care, L=Ahmedabad, S=Gujarat, C=IN"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret — signed with a throwaway key. Uninstall the previous build before installing this one."
          fi
          cd ..
          # The generated gradle.properties has NO trailing newline, so a plain
          # append glues the first property onto the last line and Gradle reads
          # "android.buildToolsVersion=36.0.0GLPCARE_UPLOAD_STORE_FILE=…".
          # The leading blank line is what keeps them separate.
          {
            echo ""
            echo "GLPCARE_UPLOAD_STORE_FILE=release.keystore"
            echo "GLPCARE_UPLOAD_KEY_ALIAS=glpcare"
            echo "GLPCARE_UPLOAD_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'glpcare-ci' }}"
            echo "GLPCARE_UPLOAD_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD || 'glpcare-ci' }}"
          } >> gradle.properties

      - name: Point the release build at the signing key
        run: node scripts/inject-signing-config.mjs

      - name: Assemble APK
        run: |
          cd android
          chmod +x ./gradlew
          if [ "${{ github.event.inputs.variant }}" = "debug" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            ./gradlew assembleRelease --no-daemon --stacktrace
          fi

      - name: Rename the APK
        run: |
          mkdir -p artifacts
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} artifacts/ \;
          ls -lh artifacts

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: glp-care-apk-${{ github.sha }}
          path: artifacts/*.apk
          retention-days: 30
          if-no-files-found: error

      # Whether this APK installs over the last one is the single most
      # consequential thing about a build here, and it was buried in a
      # `::warning::` nobody reads. This app stores the patient's weights,
      # doses and check-ins on the device, so "uninstall first" means "throw
      # your record away". Say it on the run's summary page instead.
      - name: Explain how to install this build
        if: always()
        run: |
          {
            echo "## APK"
            echo
            if [ "${{ steps.signing.outputs.persistent }}" = "true" ]; then
              echo "Signed with the keystore from repository secrets."
              echo
              echo "**Installs over the previous build.** Your data is kept."
            else
              echo "Signed with a **throwaway key generated for this run**."
              echo
              echo "**You must uninstall the previous build first.** Android refuses"
              echo "an upgrade when the signature changes, and uninstalling erases"
              echo "everything the app stored on the device — weights, doses,"
              echo "check-ins, chat history."
              echo
              echo "To stop this happening on every build, create the keystore once"
              echo "and add it as a secret:"
              echo
              echo '```bash'
              echo 'keytool -genkeypair -v -storetype PKCS12 \'
              echo '  -keystore glpcare-release.keystore -alias glpcare \'
              echo '  -keyalg RSA -keysize 2048 -validity 10000'
              echo 'base64 -w0 glpcare-release.keystore   # macOS: base64 -i ...'
              echo '```'
              echo
              echo "Settings → Secrets and variables → Actions:"
              echo "\`ANDROID_KEYSTORE_BASE64\`, \`ANDROID_KEYSTORE_PASSWORD\`,"
              echo "\`ANDROID_KEY_PASSWORD\`. Keep the keystore file safe — losing it"
              echo "means never being able to update an installed app again."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
