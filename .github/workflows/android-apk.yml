name: Build Android APK

# Produces an installable APK as a downloadable artifact.
#
# The GitHub-hosted `ubuntu-latest` runner already has the Android SDK, JDK 17
# and the NDK, so this needs no extra setup beyond `expo prebuild` + Gradle.
# It requires no Expo account and no EAS credits.
#
# Run it from the Actions tab ("Run workflow"), or let it run on every push to
# the main branches. Download the APK from the run's Artifacts section.

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      variant:
        description: 'Build variant'
        required: true
        default: 'release'
        type: choice
        options: [debug, release]

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci

      - name: Bundle for Android (Metro)
        run: npm run bundle:android

  apk:
    name: Build APK
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - run: npm ci

      - name: Write .env
        env:
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
        run: |
          # Secrets are optional: with none set, the APK still builds and runs
          # fully on-device against the bundled care library.
          {
            echo "EXPO_PUBLIC_SUPABASE_URL=${SUPABASE_URL}"
            echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}"
            echo "EXPO_PUBLIC_AI_MODEL=gpt-4o-mini"
            echo "EAS_PROJECT_ID=${EAS_PROJECT_ID}"
            echo "APP_VARIANT=production"
          } > .env

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Create a signing key
        # A release APK must be signed. For a distributable build, replace this
        # with a keystore restored from secrets (see docs/BUILDING_APK.md).
        run: |
          cd android/app
          keytool -genkeypair -v \
            -storetype PKCS12 \
            -keystore release.keystore \
            -alias glpcare \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'glpcare-ci' }}" \
            -keypass "${{ secrets.ANDROID_KEY_PASSWORD || 'glpcare-ci' }}" \
            -dname "CN=GLP Care, OU=Engineering, O=GLP Care, L=Ahmedabad, S=Gujarat, C=IN"
          cd ..
          cat >> gradle.properties <<EOF
          GLPCARE_UPLOAD_STORE_FILE=release.keystore
          GLPCARE_UPLOAD_KEY_ALIAS=glpcare
          GLPCARE_UPLOAD_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'glpcare-ci' }}
          GLPCARE_UPLOAD_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD || 'glpcare-ci' }}
          EOF

      - name: Point the release build at the signing key
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path('android/app/build.gradle')
          s = p.read_text()
          if 'GLPCARE_UPLOAD_STORE_FILE' not in s:
              s = s.replace(
                  "signingConfigs {",
                  """signingConfigs {
        release {
            if (project.hasProperty('GLPCARE_UPLOAD_STORE_FILE')) {
                storeFile file(GLPCARE_UPLOAD_STORE_FILE)
                storePassword GLPCARE_UPLOAD_STORE_PASSWORD
                keyAlias GLPCARE_UPLOAD_KEY_ALIAS
                keyPassword GLPCARE_UPLOAD_KEY_PASSWORD
            }
        }""",
                  1,
              )
              s = re.sub(
                  r"(buildTypes\s*\{[\s\S]*?release\s*\{[\s\S]*?)signingConfig signingConfigs\.debug",
                  r"\1signingConfig signingConfigs.release",
                  s,
                  count=1,
              )
              p.write_text(s)
              print('signing config injected')
          PY

      - name: Assemble APK
        run: |
          cd android
          chmod +x ./gradlew
          if [ "${{ github.event.inputs.variant }}" = "debug" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            ./gradlew assembleRelease --no-daemon --stacktrace
          fi

      - name: Rename the APK
        run: |
          mkdir -p artifacts
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} artifacts/ \;
          ls -lh artifacts

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: glp-care-apk-${{ github.sha }}
          path: artifacts/*.apk
          retention-days: 30
          if-no-files-found: error
